[package]
name = "lotus-rt"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "sync", "macros", "lotus"]
std = []
lotus = ["dep:lotus-script"]
sync = ["dep:tokio", "tokio/sync"]
macros = ["dep:tokio", "tokio/macros"]

[dependencies]
lotus-script = { version = "0.7", optional = true }
thiserror = "2"
tokio = { version = "1", default-features = false, optional = true }

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
